name: Baseline

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: video-production-console
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: video-production-console/go.mod
          cache-dependency-path: video-production-console/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-production-console/web/package-lock.json
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install chrome
      - run: ./scripts/verify-baseline.ps1 -StrictEmbeddedDist
        env:
          # The Windows default TEMP may contain the RUNNER~1 short-name alias.
          # Path-safety fixtures require canonical paths, as production inputs do.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
