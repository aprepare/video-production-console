<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    :root {
      --ink: #1a2332;
      --paper: #e8dcc8;
      --paper-2: #f3ead8;
      --seal: #b23a2f;
      --oil: #c9893a;
      --ash: #8a8175;
      --rule: rgba(26, 35, 50, 0.14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(201, 137, 58, 0.12), transparent 50%),
        linear-gradient(180deg, #121820 0%, var(--ink) 40%, #10161e 100%);
      color: var(--paper);
      font-family: "Noto Sans SC", sans-serif;
    }
    .desk { min-height: 100vh; display: grid; grid-template-columns: 92px 1fr; }
    .spine {
      border-right: 1px solid rgba(232, 220, 200, 0.12);
      padding: 28px 0 20px;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .spine h1 {
      writing-mode: vertical-rl;
      font-family: "Noto Serif SC", serif;
      font-size: 22px; font-weight: 700; margin: 0 0 12px;
    }
    .spine p { writing-mode: vertical-rl; margin: 0; color: var(--ash); font-size: 12px; letter-spacing: 0.18em; }
    .folio { padding: 28px 36px 40px; display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 16px; min-width: 0; }
    .mast { display: flex; justify-content: space-between; align-items: end; gap: 20px; }
    .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--oil); letter-spacing: 0.16em; text-transform: uppercase; }
    .mast h2 { margin: 6px 0 0; font-family: "Noto Serif SC", serif; font-size: 32px; font-weight: 700; line-height: 1.15; }
    .stats { display: flex; gap: 18px; color: var(--ash); font-family: "IBM Plex Mono", monospace; font-size: 12px; flex-wrap: wrap; }
    .note {
      color: var(--ash); font-size: 13px; line-height: 1.6;
      border: 1px solid rgba(232, 220, 200, 0.12); padding: 10px 14px;
    }
    .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .tab {
      appearance: none; border: 1px solid rgba(232, 220, 200, 0.16);
      background: rgba(232, 220, 200, 0.04); color: inherit; text-align: left;
      padding: 14px 14px 12px; cursor: pointer; min-height: 118px;
    }
    .tab:hover { background: rgba(232, 220, 200, 0.08); }
    .tab.is-on { background: var(--paper); color: var(--ink); border-color: var(--paper); }
    .tab .mark { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--oil); }
    .tab.is-on .mark { color: var(--seal); }
    .tab .name { display: block; margin: 8px 0 6px; font-family: "Noto Serif SC", serif; font-size: 18px; }
    .tab .way { font-size: 12px; color: var(--ash); line-height: 1.45; }
    .tab.is-on .way { color: #5d564c; }
    .sheet {
      background: var(--paper-2); color: var(--ink); min-height: 520px;
      display: grid; grid-template-columns: minmax(0, 1.4fr) 320px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    }
    .script { padding: 28px 32px 32px; border-right: 1px solid var(--rule); overflow: auto; max-height: calc(100vh - 390px); }
    .script p { margin: 0 0 1.15em; font-size: 16.5px; line-height: 1.95; white-space: pre-wrap; }
    .side {
      padding: 22px 22px 26px; display: flex; flex-direction: column; gap: 16px;
      background: linear-gradient(180deg, rgba(178, 58, 47, 0.06), transparent 90px), var(--paper);
    }
    .side h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.14em; color: var(--ash); font-weight: 500; }
    .titles { display: flex; flex-direction: column; gap: 6px; }
    .titles button, .action {
      appearance: none; border: 0; background: transparent; color: inherit;
      text-align: left; font: inherit; cursor: pointer;
    }
    .titles button {
      padding: 7px 0; border-bottom: 1px dashed var(--rule); font-size: 13px; line-height: 1.45;
    }
    .titles button:hover { color: var(--seal); }
    .shorts { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--rule); padding: 4px 8px; font-size: 12px; background: rgba(26, 35, 50, 0.03); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    .action {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--ink) !important; padding: 8px 10px; font-size: 12px;
    }
    .action:hover { background: var(--ink); color: var(--paper); }
    .seal {
      background: #2a1614; color: #f6e6d6; padding: 18px 22px 20px;
      display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
    }
    .seal .label { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.16em; color: #e0a39a; }
    .seal q { display: block; quotes: none; margin-top: 8px; font-family: "Noto Serif SC", serif; font-size: 22px; line-height: 1.35; }
    .seal button {
      appearance: none; border: 1px solid rgba(246, 230, 214, 0.35); background: transparent;
      color: inherit; padding: 10px 12px; cursor: pointer; font-size: 12px;
    }
    .toast {
      position: fixed; right: 24px; bottom: 24px; background: var(--paper); color: var(--ink);
      padding: 10px 14px; font-size: 13px; opacity: 0; transform: translateY(8px);
      pointer-events: none; transition: opacity 160ms ease, transform 160ms ease;
    }
    .toast.show { opacity: 1; transform: none; }
    @media (max-width: 1100px) {
      .tabs { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 980px) {
      .desk { grid-template-columns: 1fr; }
      .spine { flex-direction: row; padding: 16px 18px; border-right: 0; border-bottom: 1px solid rgba(232, 220, 200, 0.12); }
      .spine h1, .spine p { writing-mode: horizontal-tb; }
      .folio { padding: 18px; }
      .sheet, .seal { grid-template-columns: 1fr; }
      .script { max-height: none; border-right: 0; border-bottom: 1px solid var(--rule); }
      .mast h2 { font-size: 24px; }
      .seal q { font-size: 18px; }
    }
    @media (max-width: 640px) {
      .tabs { grid-template-columns: 1fr; }
      .tab { min-height: 0; }
    }
  </style>
</head>

  <script>window.REMIX_DRAFTS = [{"id": "01", "file": "二创01.txt", "name": "正序拆闸", "way": "会议开场，按水龙头→两回历史→第三回数字往下拆", "comment": "顺风顺水", "short_titles": ["央行第三次开闸", "170万亿要往外走", "近二十年翻身窗口"], "titles": ["刚刚开完会，第三次放水要来了", "170万亿居民存款，闸一开会往哪冲", "过去四十年只开过两回闸", "房价涨二十年，根子是放水", "居民存款两个月流出超过2万亿", "现在卡在第一阶段最后一截", "五块钱换少走十年弯路"], "topics": ["#财经", "#存款", "#降息", "#央行", "#财富觉醒"], "chars": 2561, "cta": "窗口一天比一天窄，主页橱窗点开，上车得趁早，我在车里等着你。新老朋友顺手点个关注，放水一有动静，我第一时间拆给你听。", "script": "刚刚开完银行内部会议，有一件大事得马上跟你们讲，央行即将打开资金水龙头，这次放水将会诞生一批新财富新富豪。很多人压根没搞懂这背后的门道，觉得放水是银行的事，跟自己没半毛钱关系。可实际上，一场牵动170万亿居民储蓄的财富大洗牌已经安安静静的开始了。你今天再忙，这条也别划走，从头听到尾，一个字都别落。我不夸张地说，真听进去了，你和你家里人往后能少熬二十年。别人划走这条视频无所谓，你不能，因为它不是随便推给你的，它只会在你日子真正要往上走的那个节点，出现在你手机上。所以先做四件小事：点个赞，收藏起来，转给你家里管钱的那个人，评论区打四个字，顺风顺水。不是走过场，是给你自己心里立个桩。好，闲话不说，进正题。\n\n这事为什么跟你我这种普通人绑得死死的？在咱这儿想挣到钱，光靠拼命干、光靠一张文凭，早就不够用了。真正管用的，是跟上大钱的方向。大钱往哪儿涌，哪儿的东西就涨价，哪儿就出富人。可大多数人没想明白一层：这些大钱，平时是谁在管？银行。银行利息给得高，钱就愿意在账上趴着睡大觉；利息一降，钱就待不住，要出去找能生更多钱的地方。\n\n那谁决定利息高低？央行。央行就是这个水龙头的总闸，它不会闲着没事拧一下。每拧一回、每调一次利率，后面都有国家的一盘大棋。国家想把哪个新行业推起来，就压低利率，把银行里睡觉的钱赶出来，灌进那个方向，整个行业跟着起飞。反过来，市面上钱太多、经济烧得太热，就把闸拧紧、利息抬高，把钱收回银行，免得物价乱涨、泡沫乱飞。所以这一轮放水，对咱普通人来说，很可能是近二十年里少有的一次能翻身的机会。\n\n那我问你一个问题：过去那二十年，房子为什么涨成那样？99%的人张口就说，人多房少，供不应求。这话不算错，但没说到根上。真话说出来，你可能一下子还不信：房价能蹿上天，根子不是人口，是央行开闸放水。你得知道，过去四十年，央行大幅降息、拧开水龙头，一共就干过两回，每一回都造出一批新财富、一批新富豪。那这第三回，钱会往哪儿涌？谁能成为下一批富起来的人？我把前两回一条一条拆给你看，你自己就有答案了。\n\n第一回，上世纪90年代初。国家全力搞市场经济，扶民营制造业，央行一连串降息，老百姓存在银行里的钱哗哗往外流，最后齐刷刷涌进了家电这个行当。长虹、海尔这些牌子，就是靠这波便宜钱扩厂子、铺渠道，几年工夫把进口货挤到了边上。那时候看懂风向的人，开个配件厂、做个区域批发，全踩在了点上，成了国内第一批靠实业起家的百万富翁。绝大多数老百姓呢？手里捏着存折，舍不得那点高利息，觉得钱放银行最踏实。等他们回过神想进场，红利窗口早关了，只能眼看着别人发家，一代人的机会就这么错过去。\n\n第二回，2008年前后，离咱们最近，也是一场全民都能沾上的财富大礼包。那年为了顶住全球金融危机，同时把城市化提速，央行再一次狠狠降息，水龙头直接拧到底。银行里堆着的存款倾泻出来，最后全汇进了一个超级大池子：房地产。地方把地押给银行换钱修路盖桥，开发商借银行的钱拿地盖楼，老百姓背上按揭买房，这一整条链子，转的全是放出来的钱。这一波把中国的城市往前推了十几年，全国房价也跟着连涨二十年。跟对节奏的人，做开发的、卖建材做装修的、开工程机械的，个个挣到手软。就连没什么本钱的普通人，那会儿咬咬牙凑个首付，贷款囤上几套房，今天资产也早翻了几倍，早早就不用为钱发愁了。\n\n所以你记住，央行调利率从来不是拍脑袋决定的。国家发展需要什么，钱就往哪儿流。前两次开闸，实打实把咱们的经济抬上了不止一个台阶，也养出了一大批新富人。\n\n眼下正好走到下半年的拐点。央行会刚开完，第三次放水马上要启动，而且这一回的力度和速度，会远远超过前两次。为什么这么说？你看两个数。第一个，老百姓的存款总额冲到了170万亿，历史最高。注意，这只是个人手里的钱，企业和机构的还没算进去。光这一项，就比前两次放水时的存款总量还多。水池里的水比以前多得多，闸一开，冲出来的劲头你自己想。第二个，现在消息传得多快你知道，前两回是慢慢发酵，这一回很快就会满屏都是。你还在琢磨这消息是真是假，已经有人提前把位置占好了。央行最新的数据你去看：居民存款两个月连着往下掉，流出去的钱已经超过2万亿。央行的数据不会骗人，钱已经在动了，大放水真真切切在路上。\n\n每一次大放水之前，我都把方向指给了愿意听的人，这次也不例外。到底该怎么跟、什么不能碰，我放在最后说，你先把下面这段听完，心里先有个底。\n\n前两次放水，都走过三个阶段。第一阶段拼认知，看谁下手快。央行放水是慢慢拧的，利率一点一点往下走，在这个过程里，谁胆子大、谁先看懂趋势、谁先进场，谁就翻身上岸。第二阶段拼资本，门槛一下子抬高，大机构进来扫货，留给普通人的口子一下子就窄了。第三阶段拼的是背景，规矩彻底焊死，那时候就跟普通人没关系了。\n\n咱们现在卡在哪儿？第一阶段最后那一小截窗口。再过几天，相关政策一落地，普通人再想进，难度立刻翻十倍。等大家伙儿全反应过来、都知道这儿能捞钱了，你再往里冲，晚了。到那时你就只能干看着别人挣得盆满钵满，自己账上那点存款，被通胀一口一口吃掉。\n\n如果你现在也迷茫，不想再看着存款跑不过通胀一点点缩水，又想像上一回抓住放水的人那样提前把位置占好，那从今天起，做三件事。第一，把朋友圈关了。第二，游戏卸了，没用的饭局推了。第三，花两秒钟，进我主页，点开橱窗里那门《财富觉醒方法论》。说句实在话，这门课推广期五块钱。五块钱现在一碗面都吃不上，坐趟地铁都不够。可它能把光说不练、从来不主动学的人筛出去，能留下来的，都是真想改变的人。我建议一家人里至少出一个人来听。\n\n你以为自己拿不到结果是不够拼，其实只是脑子里那道阀门一直没打开。学完你就明白，你缺的根本不是吃苦的本事，是站的位置不对。五块钱，换的是少走十年弯路：这轮放水的钱到底往哪儿流，普通人从哪儿切进去，现在该动哪一步，什么东西碰都不能碰。一家人里有一个人听明白了，全家的钱走的就是另一条路。\n\n有人嫌五块钱的东西能有多好。我倒想问一句：你缺的是五块钱，还是缺一个能把事看透的脑袋？等这轮趋势彻底铺开那天，你回头看，会庆幸自己今天没犹豫。窗口一天比一天窄，主页橱窗点开，上车得趁早，我在车里等着你。新老朋友顺手点个关注，放水一有动静，我第一时间拆给你听。"}, {"id": "02", "file": "二创02.txt", "name": "钱听谁的", "way": "先讲钱听利息、利息听央行，再套两回剧本", "comment": "顺风顺水", "short_titles": ["钱到底听谁的", "利息一降钱就跑", "两回开闸同一剧本"], "titles": ["钱不认拼命，只认利息", "银行利息一降，钱就坐不住", "90年代家电、2008年房子，都是开闸造的富人", "170万亿水位，闸一开冲得更猛", "钱已经动了，两个月流出2万亿", "第一阶段尾巴上，难度马上翻十倍", "一家有一个人听明白，钱走另一条路"], "topics": ["#财经", "#存款", "#银行", "#降息", "#财富觉醒"], "chars": 2146, "cta": "窗口越来越窄，主页橱窗点开，车要开了，趁早上，我在车上等你。新老朋友点个关注，放水一动，我第一时间拆给你听。", "script": "刚刚开完银行内部会议，有一件大事得马上跟你们讲，央行即将打开资金水龙头，这次放水将会诞生一批新财富新富豪。很多人压根没搞懂这背后的门道，觉得放水是银行的事，跟自己没半毛钱关系。可实际上，一场牵动170万亿居民储蓄的财富大洗牌已经安安静静的开始了。今天不管手上忙什么，先把这条听完，一个字别漏。真听懂了，往后你跟家里人少拼二十年不是玩笑。别人划走随他，你别划，这条不是乱推的，专挑你日子该翻篇的时候送到你面前。先把四个动作做了：赞点上，收藏好，转给你家里管钱的那位，评论区写四个字，顺风顺水。不是客套，是给自己钉个钉子。行，说正事。\n\n咱先掰扯清楚一件事：钱到底听谁的。你以为拼命干活、多考几张证就能翻身？不够。在咱这儿，钱是跟着大资金走的，大钱扎堆的地方，价格就往上蹿，富人就从那儿冒出来。那大钱平时搁哪儿？银行。利息高，钱就在银行账上躺着不动，跟睡大觉一个样；利息一掉，钱立马坐不住，得出去找更肥的地方。\n\n利息谁定？央行。央行手里握着这根总闸，闸不是随便碰的，每碰一次都连着国家下一步要干什么。要扶哪个新行业，就把利率压下去，逼银行里的钱出来，冲进那个行业，行业就起来了。经济要是烧过头，就把利率抬上去，钱回银行歇着，物价压住，泡沫挤掉。所以你别把这轮放水当新闻听，对普通人来说，这是近二十年里数得过来的几次翻身机会之一。\n\n过去四十年，央行大开闸一共两回。两回，都是同一个剧本。\n\n头一回，上世纪90年代初。国家要搞市场经济、扶民营制造，央行连着降利息，老百姓的存款从银行往外涌，涌进了家电。长虹、海尔这些厂子，拿着便宜钱扩产、铺货，几年就把洋品牌顶出去了。看懂的人，开个小厂做配件，或者在一个地区做批发，全吃上了，成了国内最早那批靠办厂发家的百万富翁。没看懂的呢？存折捏得死紧，舍不得那点利息，觉得银行最保险。等他们想动，红利早分完了，只能看着邻居盖楼买车，整整一代人的机会就这么溜走了。\n\n第二回，2008年前后，这回你肯定有感觉。全球金融危机压过来，国家要加速城市化，央行把利息狠狠往下砍，水龙头开到最大。银行里的存款哗哗往外淌，全淌进了一个池子：房地产。地方拿地去银行换钱修基建，开发商贷款拿地盖楼，老百姓贷款买房，整条线全靠放出来的钱转。城市往前蹦了十几年，房价一口气涨了二十年。做开发的、卖建材做装修的、开工程机械的，个个数钱数到手软。哪怕没本钱的普通人，那时候咬牙凑个首付多买两套，今天资产也翻了几倍。\n\n说到这儿你就明白了：过去二十年房价为什么涨成那样？99%的人说人多房少。不对，真话你可能不爱听，根子就是央行开闸，钱从银行冲进了楼市。央行调利息从来不是随手一拧，国家要什么，钱就往哪儿去。两回开闸，经济上了台阶，也造出两批新富人。\n\n现在，第三回来了。下半年这个拐点，央行会刚开完，新一轮放水马上启动，力度和速度都会盖过前两回。凭什么这么说？两个数。第一，老百姓存款已经堆到170万亿，历史最高，还没算企业和机构那部分。光这一块就比前两回放水时的存款总量还大，水位越高，闸一开冲得越猛。第二，现在消息传得有多快你清楚，前两回是慢慢发酵，这回一眨眼就满屏。你还在琢磨真的假的，有人已经把位置占了。央行最新数据摆着：居民存款连着两个月往下掉，跑出去的钱超过2万亿。数据不会撒谎，钱已经动了。\n\n每一回放水之前，方向我都先给愿意听的人指过，这回也一样。具体怎么跟、什么别碰，最后说，你先把这段听完，心里有个底再往下走。\n\n前两回放水都走了三步，这回也逃不出去。第一步拼认知。央行不是一下子把闸拧到底，利率是一点一点往下降的，这个慢慢松的过程，就是普通人唯一的口子：谁先看懂、谁敢先进，谁翻身。第二步拼资本。门槛猛抬，大机构带着大钱进场扫货，普通人的口子一下子收窄，只能捡边角。第三步拼背景。规矩焊死，桌子坐满，普通人出局，连看热闹的位置都没有。\n\n咱现在卡在哪儿？第一步的尾巴上。再过几天政策一落地，普通人再想进，难度翻十倍。等所有人都反应过来、都知道这里能挣钱，你再进，只剩别人挑剩下的。到那时候，你看着先动手的人挣够了，自己账上的钱躺在银行里，被通胀一口一口啃没。\n\n要是你现在心里也没底，不想再看着存款一天天缩水，又想跟上一回踩准点的人一样先把位置占了，那从今天起，三件事。头一件，朋友圈关掉。第二件，游戏删了，没意思的饭局别去。第三件，花两秒钟，进我主页，橱窗里那门《财富觉醒方法论》点开。实话实说，推广期就五块钱。五块钱，一份早点都买不齐，一趟公交来回都不够。可它能把嘴上说要变、手上从来不动的人筛出去，留下的都是真想改的人。我建议一家至少出一个人来听。\n\n你以为拿不到结果是自己不够拼？不是。是你脑子里那道阀门一直关着。听完你就懂，你不缺吃苦的本事，你缺的是站对地方。五块钱，换的是少绕十年弯路：这轮钱往哪儿流，普通人从哪儿切，现在该动哪一步，什么千万别碰。一家有一个人听明白，全家的钱就走另一条路。\n\n有人嫌五块钱能买到什么好东西？我问你，你少抽半包烟花了多少钱？你缺的是五块钱，还是缺一个能看透事的脑子？等这轮铺开那天，你回头看，会庆幸今天没犹豫。窗口越来越窄，主页橱窗点开，车要开了，趁早上，我在车上等你。新老朋友点个关注，放水一动，我第一时间拆给你听。"}, {"id": "03", "file": "二创03.txt", "name": "房价先问", "way": "开场先打人多房少，再回溯两回开闸", "comment": "顺风顺水", "short_titles": ["房价不是人多房少", "钱把房价顶上去的", "第三回比前两回更凶"], "titles": ["过去二十年房子凭什么涨成那样", "人多房少只是表面，根子是放水", "房价是被放出来的钱顶上去的", "第一回家电，第二回房子，第三回呢", "170万亿加上2万亿，钱已经在搬家", "政策一落地，普通人再进难度翻十倍", "你缺的是五块钱，还是把事看透的脑子"], "topics": ["#财经", "#房价", "#存款", "#放水", "#财富觉醒"], "chars": 2079, "cta": "窗口在收窄，主页橱窗点开，车快开了，早上早坐稳，我在车上等你。新老朋友点个关注，放水一有动静，我第一时间拆给你听。", "script": "刚刚开完银行内部会议，有一件大事得马上跟你们讲，央行即将打开资金水龙头，这次放水将会诞生一批新财富新富豪。很多人压根没搞懂这背后的门道，觉得放水是银行的事，跟自己没半毛钱关系。可实际上，一场牵动170万亿居民储蓄的财富大洗牌已经安安静静的开始了。你现在再忙，也把这条从头看完，别跳。我说句不夸张的，真听进去了，你跟家里人往后能省下二十年的折腾。这条视频别人划走无所谓，你不能划，它不是随便推的，是等你日子要往上走那一刻才出现。先把四件事做了：点赞，收藏，转给你家管钱的人，评论区打四个字，顺风顺水。不是形式，是给你自己心里留个坐标。好，进正题。\n\n先问你一个问题。过去二十年，房子凭什么涨成那样？99%的人张嘴就来：人多房少，供不应求。这话听着顺，但没到根上。真话说出来你可能不信：房价是被放出来的钱顶上去的，不是被人口顶上去的。为什么这么说？你得先搞明白钱是怎么走的。\n\n想挣钱，光拼命、光有文凭，早不够了。得看大钱往哪儿走，大钱到哪儿，哪儿就涨，富人就从哪儿出。那大钱平时在谁手里？银行。利息给得高，钱就在账上趴着睡大觉，谁也不愿意挪；利息一降，钱躺不住了，得出去找能多生钱的地方。\n\n那利息谁定？央行。央行是总闸，闸不是随便碰的，每拧一下都有国家的盘算。国家要推哪个行业，就把利率压低，把银行里的钱赶出去，灌进那个行业，行业跟着起来；经济烧过头了，就把利率抬高，把钱收回银行待着，压物价、挤泡沫。所以这轮放水，别当新闻听，对咱普通人这是近二十年少见的翻身窗口。\n\n过去四十年，央行大开闸只有两回，每回都造出一批新富人。第三回钱去哪儿、谁能站上去，先看前两回。\n\n第一回，上世纪90年代初。国家推市场经济、扶民营制造，央行一连降息，老百姓的存款从银行涌出来，全进了家电。长虹、海尔拿这波便宜钱扩产铺货，几年把进口牌子挤到一边。看懂的人开配件厂、在一个地区做批发，全踩上了，成了国内第一批靠办实业起来的百万富翁。大多数人呢？攥着存折舍不得利息，觉得银行最稳。等回过神想跟，红利没了，窗口关了，只能看着别人发家，整整一代人的机会就这么过去了。\n\n第二回，2008年前后，这回离咱最近，你肯定有感觉。全球金融危机来了，国家要加快城市化，央行狠降利息，闸开到底。银行存款倾泻出来，汇进房地产这个大池子。地方拿地抵押搞基建，开发商借钱拿地盖楼，老百姓按揭买房，整条链子从头到尾都靠放出来的钱转。城市往前跑了十几年，房价连涨二十年。搞开发的、做建材和装修的、开工程机械的，个个挣到手软。没本钱的普通人，那时咬咬牙凑个首付囤几套房，今天资产也翻了几倍，早不用为钱发愁。\n\n所以说回开头那个问题，房价涨二十年，根子就是这第二回开闸。央行调利率从来不是拍脑袋，国家要什么，钱就往哪儿去。两回开闸，经济上台阶，富人换了两批。\n\n现在到下半年拐点了。央行会刚开完，第三次放水马上启动，力度速度都会超过前两回。看两个数。第一，居民存款冲到170万亿，历史最高，企业机构的还没算。光这一头就比前两回放水时的总量大，水越多闸一开冲得越凶。第二，现在消息跑得有多快你清楚，这回不会像前两回慢慢发酵，很快就铺天盖地。你还在犹豫真假，有人已经提前站好了位。央行最新数据：居民存款两个月连降，流出的钱超过2万亿。数据不骗人，钱在动，大放水真真切切在路上。\n\n每回大放水前我都把方向告诉愿意听的人，这回一样。怎么跟、什么别碰，最后说，先听完下面这段，心里有底再动。\n\n前两回放水都分三个阶段，这回也一样。第一阶段拼认知。利率是慢慢往下调的，不是一天到底，这个慢慢松的过程就是普通人唯一的口子：谁先看懂、谁敢先进，谁翻身。第二阶段拼资本。门槛猛抬，大机构带着大钱扫货，普通人机会断崖往下，只能捡边角。第三阶段拼背景。规矩焊死，桌子坐满，普通人出局。\n\n现在卡在哪儿？第一阶段最后一截。再过几天政策落地，普通人再想进，难度翻十倍。等人人都知道这里能挣钱，你再进，晚了，只能看别人挣够，自己的存款趴在银行里被通胀一口一口吃。\n\n如果你现在也发懵，不想眼看着存款跑不过通胀一点点缩水，又想跟上一回抓住放水的人一样提前占位，那从今天开始，做三件事。第一，朋友圈关掉。第二，游戏卸载，没用的饭局推掉。第三，花两秒钟进我主页，点开橱窗里的《财富觉醒方法论》。说句实话，推广期只收五块钱。五块钱，一瓶饮料不够，一把青菜也就这价。可它能把光说不干的人筛掉，留下的都是真想改变的人。我建议一家至少一个人来听。\n\n你以为拿不到结果是不够拼，其实是脑子里那道阀门没开。听完你就明白，你不缺吃苦的劲儿 价为什么涨成那样？99%的人说人多房少。真话说出来你可能不信，根子就是央行开闸，钱冲进了楼市。央行调利率从来不是拍脑袋，国家要什么，钱就往哪儿流。两回开闸，经济上台阶，富人换了两批。\n\n现在第三回到了。下半年拐点，央行会刚开完，新一轮放水马上启动，力度速度都超前两回。看两个数。第一，居民存款冲到170万亿，历史最高，企业机构的还没算，光这一头就比前两回放水时的总量大，水越多闸一开冲得越凶。第二，现在消息传得飞快，前两回慢慢发酵，这回很快铺天盖地。你还在犹豫真假，有人已经站好了位。央行最新数据：居民存款两个月连降，流出的钱超过2万亿。数据不骗人，你家那笔钱的邻居们已经开始搬家了。\n\n每回大放水前我都把方向告诉愿意听的人，这回一样。怎么跟、什么别碰，最后说，先听完下面这段。\n\n前两回放水都分三个阶段。第一阶段拼认知，利率慢慢降，谁先看懂谁先进，谁翻身。第二阶段拼资本，门槛猛抬，大机构扫货，普通人机会断崖往下掉。第三阶段拼背景，规矩焊死，普通人出局。\n\n现在卡在第一阶段最后一截。再过几天政策落地，难度翻十倍。等人人都知道这里能挣钱，你再进，晚了，只能看别人挣够，你家那笔钱继续在银行里被通胀一口一口吃。\n\n如果你现在也没底，不想再看着家里那笔钱一天天缩水，又想像上一回抓住放水的人一样先把位置占好，从今天起做三件事。第一，朋友圈关掉。第二，游戏卸掉，没用的饭局推掉。第三，花两秒进我主页，点开橱窗里的《财富觉醒方法论》。实话实说，推广期只要五块钱。五块钱，路边一根玉米的价，可它能把光说不干的人筛出去，留下的都是真想改的人。我建议一家至少一个人来听，最好就是管钱那位。\n\n你以为拿不到结果是不够拼？是脑子里那道阀门一直没开。听完你就明白，你不缺吃苦的本事，缺的是站对位置。五块钱换的是少走十年弯路：这轮钱往哪儿流，普通人从哪儿切，现在动哪一步，什么碰都别碰。一家有一个人听懂，全家的钱走另一条路。\n\n有人嫌五块钱能有啥好东西？我问你，群里抢来的红包你拿它干过什么正事？你缺的是五块钱，还是缺一个能把事看透的脑子？等这轮铺开那天，你回头会庆幸今天没犹豫。窗口在收窄，主页橱窗点开，车要开了，趁早上，我在车上等你。新老朋友点个关注，放水一有动静，我第一时间拆给你听。"}];</script>
  <script>
    const drafts = window.REMIX_DRAFTS || [];
    let current = 0;
    const $ = (id) => document.getElementById(id);
    function toast(text) {
      const el = $("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1600);
    }
    async function copy(text, ok) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      toast(ok);
    }
    function paras(script) {
      return script.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    }
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function renderTabs() {
      $("tabs").innerHTML = drafts.map((draft, index) => `
        <button type="button" class="tab${index === current ? " is-on" : ""}" data-i="${index}">
          <span class="mark">${draft.id} · ${draft.chars}字</span>
          <span class="name">${escapeHtml(draft.name)}</span>
          <span class="way">${escapeHtml(draft.way)}</span>
        </button>
      `).join("");
    }
    function render() {
      const draft = drafts[current];
      $("headline").textContent = draft.name;
      $("count").textContent = draft.chars + " 字";
      $("script").innerHTML = paras(draft.script).map((p) => "<p>" + escapeHtml(p) + "</p>").join("");
      $("shorts").innerHTML = draft.short_titles.map((t) => "<span class='chip'>" + escapeHtml(t) + "</span>").join("");
      $("topics").innerHTML = draft.topics.map((t) => "<span class='chip'>" + escapeHtml(t) + "</span>").join("");
      $("titles").innerHTML = draft.titles.map((t) => "<button type='button' data-copy='" + escapeHtml(t) + "'>" + escapeHtml(t) + "</button>").join("");
      $("cta").textContent = draft.cta;
      renderTabs();
    }
    $("tabs").addEventListener("click", (event) => {
      const btn = event.target.closest("[data-i]");
      if (!btn) return;
      current = Number(btn.dataset.i);
      render();
    });
    $("titles").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-copy]");
      if (!btn) return;
      copy(btn.dataset.copy, "标题已复制");
    });
    $("copyScript").addEventListener("click", () => copy(drafts[current].script, "正文已复制"));
    $("copyFile").addEventListener("click", () => copy(drafts[current].file + "\n\n" + drafts[current].script, "带文件名已复制"));
    $("copyCta").addEventListener("click", () => copy(drafts[current].cta, "压轴已复制"));
    render();
  </script>
